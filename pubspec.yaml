name: radarme
description: RadarME — upozorava vozače na radare i kamere za kontrolu saobraćaja u Crnoj Gori.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Backend
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

  # Maps (TileLayer ships inside flutter_map; there is no separate
  # flutter_map_tile_layer package on pub.dev)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Location + permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Alarm output
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  vibration: ^3.1.3

  # Background tracking
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  flutter_background_service_ios: ^5.0.3

  # Storage + presentation
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1

  # Detail screen actions
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sounds/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  remove_alpha_ios: true
